log4j.rootLogger=INFO, file

# Low-overhead phase probe: only FileLoaderFast + DDSIntegration at INFO.
log4j.logger.com.genir.renderer.overrides.loading=WARN
log4j.logger.com.genir.renderer.overrides.loading.FileLoaderFast=INFO
log4j.logger.com.genir.renderer.overrides.loading.textures.DDSIntegration=INFO
log4j.logger.com.fs.starfarer.loading=WARN
log4j.logger.com.fs.starfarer.campaign.rules.Rules=WARN

log4j.appender.ConsoleAppender=org.apache.log4j.ConsoleAppender
log4j.appender.ConsoleAppender.layout=org.apache.log4j.PatternLayout
log4j.appender.ConsoleAppender.layout.ConversionPattern=%-4r [%t] %-5p %c %x - %m%n

log4j.appender.file=org.apache.log4j.RollingFileAppender
log4j.appender.file.File=${com.fs.starfarer.settings.paths.logs}/starsector.log
log4j.appender.file.layout=org.apache.log4j.PatternLayout
log4j.appender.file.layout.ConversionPattern=%-4r [%t] %-5p %c %x - %m%n
log4j.appender.file.MaxFileSize=50000KB
log4j.appender.file.MaxBackupIndex=3
