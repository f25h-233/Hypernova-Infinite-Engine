# Texture patch variants: one line per supported GraphicsLib version.
#
#   <version>=<path to Graphics.jar>[|<path to that version's TextureData.java>]
#
# Paths are resolved relative to the repository root unless absolute.
# The second field is only needed when the jar does not ship .java sources
# (GraphicsLib 1.12.2+ ships class files only).
#
# Both jars are staged under .cache/ (gitignored). To rebuild on another machine,
# put the corresponding Graphics.jar / source there or edit these paths.
# Release builds should use JDK 17 (JAVAC=/path/to/jdk-17/bin/javac), which
# reproduces 1.12.2's shipped TextureData.class byte-for-byte.
1.12.1=.cache/graphicslib-1.12.1/Graphics.jar
1.12.2=.cache/graphicslib-1.12.2/Graphics.jar|.cache/graphicslib-1.12.2/src/TextureData.java
